server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Preserve Cloudflare Access identity explicitly for supervisor-only writes.
    proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
    proxy_set_header X-User-Email $http_x_user_email;
    proxy_read_timeout 360s;
  }

  location = /healthz {
    proxy_pass http://api:8080/healthz;
  }

  location = /readyz {
    proxy_pass http://api:8080/readyz;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # During active development, never let a browser or Cloudflare serve an old
  # builder/shared.js that still publishes only to localStorage.
  add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  add_header Pragma "no-cache" always;
  add_header Expires "0" always;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
}
