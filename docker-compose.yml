services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-site_assignment}
      POSTGRES_USER: ${POSTGRES_USER:-site_assignment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-site_assignment}
    volumes:
      - site_assignment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-site_assignment} -d ${POSTGRES_DB:-site_assignment}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://site_assignment:site_assignment@db:5432/site_assignment}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  site_assignment_pgdata:
